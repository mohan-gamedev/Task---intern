<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kanban Pro Board</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container py-4">

    <h1 class="text-center mb-4">
        🚀 Kanban Pro Board
    </h1>

    <!-- Task Form -->

    <div class="card p-3 mb-4 shadow-sm">

        <div class="row g-2">

            <div class="col-md-3">
                <input
                    type="text"
                    id="taskInput"
                    class="form-control"
                    placeholder="Task Name">
            </div>

            <div class="col-md-3">
                <textarea
                    id="description"
                    class="form-control"
                    placeholder="Description">
                </textarea>
            </div>

            <div class="col-md-2">
                <input
                    type="date"
                    id="dueDate"
                    class="form-control">
            </div>

            <div class="col-md-2">

                <select
                    id="priority"
                    class="form-select">

                    <option value="high">
                        High
                    </option>

                    <option value="medium">
                        Medium
                    </option>

                    <option value="low">
                        Low
                    </option>

                </select>

            </div>

            <div class="col-md-2">

                <button
                    class="btn btn-primary w-100"
                    onclick="addTask()">

                    Add Task

                </button>

            </div>

        </div>

    </div>

    <!-- Search -->

    <div class="row mb-4">

        <div class="col-md-6">

            <input
                type="text"
                id="search"
                class="form-control"
                placeholder="Search Tasks"
                onkeyup="renderTasks()">

        </div>

        <div class="col-md-2">

            <button
                class="btn btn-dark w-100"
                onclick="toggleTheme()">

                Dark Mode

            </button>

        </div>

        <div class="col-md-2">

            <button
                class="btn btn-success w-100"
                onclick="exportTasks()">

                Export

            </button>

        </div>

        <div class="col-md-2">

            <input
                type="file"
                class="form-control"
                onchange="importTasks(event)">

        </div>

    </div>

    <!-- Dashboard -->

    <div class="stats mb-4">

        <div class="card text-center">
            <div class="card-body">
                <h6>Total Tasks</h6>
                <h2 id="totalTasks">0</h2>
            </div>
        </div>

        <div class="card text-center">
            <div class="card-body">
                <h6>To Do</h6>
                <h2 id="todoCount">0</h2>
            </div>
        </div>

        <div class="card text-center">
            <div class="card-body">
                <h6>In Progress</h6>
                <h2 id="progressCount">0</h2>
            </div>
        </div>

        <div class="card text-center">
            <div class="card-body">
                <h6>Done</h6>
                <h2 id="doneCount">0</h2>
            </div>
        </div>

    </div>

    <!-- Progress -->

    <div class="progress mb-4">

        <div
            id="progressBar"
            class="progress-bar progress-bar-striped progress-bar-animated"
            style="width:0%">

            0%

        </div>

    </div>

    <!-- Kanban Board -->

    <div class="board">

        <!-- To Do -->

        <div class="column">

            <h4>
                To Do
            </h4>

            <div
                id="todo"
                class="dropzone"
                ondrop="drop(event)"
                ondragover="allowDrop(event)">
            </div>

        </div>

        <!-- Progress -->

        <div class="column">

            <h4>
                In Progress
            </h4>

            <div
                id="progress"
                class="dropzone"
                ondrop="drop(event)"
                ondragover="allowDrop(event)">
            </div>

        </div>

        <!-- Done -->

        <div class="column">

            <h4>
                Done
            </h4>

            <div
                id="done"
                class="dropzone"
                ondrop="drop(event)"
                ondragover="allowDrop(event)">
            </div>

        </div>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
